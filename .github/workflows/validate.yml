name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators track upstream rules, so a repo that passed can start
    # failing without any change here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets live in the home-assistant/brands repo and are only
          # required to be listed in the HACS default store, not to install
          # this as a custom repository.
          ignore: brands

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        # Home Assistant is stubbed out, so this needs no dependencies.
        run: python3 tests/test_renovate_updates.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --select E,F,I,UP,B,SIM --target-version py312
